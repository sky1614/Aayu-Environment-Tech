<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Aayu Enviro Tech</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b4d35;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-hex {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: #266041;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      margin-bottom: 12px;
    }
    .logo-hex-inner {
      width: 24px;
      height: 24px;
      background: #FFEB3B;
      transform: rotate(45deg);
      border-radius: 3px;
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a3a28;
      letter-spacing: -0.3px;
    }
    .logo p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: #266041;
      background: #fff;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #266041;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button[type="submit"]:hover  { background: #1a4731; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    #error-msg {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-hex"><div class="logo-hex-inner"></div></div>
      <h1>Aayu Enviro Tech</h1>
      <p>ConnectX Admin Portal</p>
    </div>

    <h2>Sign in</h2>
    <p class="subtitle">Enter your credentials to access the dashboard.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="admin@aayuenviro.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" id="submit-btn">Sign in</button>
    </form>

    <div id="error-msg"></div>
  </div>

  <script src="api.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) location.href = 'admin-dashboard.html';

    const form    = document.getElementById('login-form');
    const btn     = document.getElementById('submit-btn');
    const errBox  = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        await login(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        location.href = 'admin-dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
